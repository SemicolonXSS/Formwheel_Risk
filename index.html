<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FormWheel Risk</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#17181c}
button,input{font:inherit}
button{cursor:pointer;border:0}
.app{max-width:760px;margin:auto;padding:24px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.logo{font-size:24px;font-weight:800;letter-spacing:-1px;color:#17181c;text-decoration:none}
.badge{font-size:12px;font-weight:700;padding:7px 10px;border-radius:999px;background:#111;color:#fff}
.card{background:#fff;border:1px solid #e7e8eb;border-radius:22px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.05)}
.hidden{display:none!important}
h1{margin:0 0 8px;font-size:32px;letter-spacing:-1.5px}
h2{margin:0 0 10px;letter-spacing:-.7px}
p{color:#6b6f78}
input{width:100%;padding:15px 16px;border:1px solid #dddfe4;border-radius:14px;outline:0;margin:8px 0 12px}
input:focus{border-color:#111}
.primary{width:100%;padding:15px;border-radius:14px;background:#111;color:#fff;font-weight:750}
.primary:disabled{opacity:.5;cursor:not-allowed}
.secondary{padding:12px 16px;border-radius:12px;background:#f0f1f3;font-weight:700}
.row{display:flex;gap:10px;align-items:center}
.room{font-size:30px;font-weight:850;letter-spacing:5px;text-align:center;padding:16px;background:#f5f6f8;border-radius:15px;margin:16px 0}
.players{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
.player{padding:14px;border:1px solid #e5e6ea;border-radius:15px;display:flex;justify-content:space-between}
.player.me{border-color:#111}
.small{font-size:13px;color:#777}
.game-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.round{font-weight:800}
.score{font-size:13px;color:#666}
.result{padding:22px;border-radius:18px;background:#f5f6f8;text-align:center;margin:14px 0}
.result .emoji{font-size:44px}
.result .big{font-size:28px;font-weight:850;margin-top:6px}
.bet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0}
.bet{padding:14px 8px;border-radius:13px;background:#f0f1f3;font-weight:800}
.bet.selected{background:#111;color:#fff}
.bet:disabled{opacity:.45;cursor:not-allowed}
.players-game{display:grid;gap:9px;margin-bottom:16px}
.pbar{display:flex;justify-content:space-between;padding:12px 14px;border-radius:12px;background:#f6f6f7}
.pbar .tag{font-size:12px;color:#999;font-weight:700}
.pbar .tag.wait{color:#b8860b}
.pbar .tag.done{color:#1a7f37}
.log{font-size:13px;color:#666;line-height:1.6;max-height:120px;overflow:auto}
.center{text-align:center}
.notice{padding:12px 14px;background:#fff8df;border-radius:12px;color:#725d16;font-size:13px;margin:12px 0}
.waitmsg{text-align:center;color:#777;font-size:14px;padding:10px 0}
@media(max-width:520px){.bet-grid{grid-template-columns:repeat(2,1fr)}.card{padding:19px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><a class="logo" href="https://semicolonxss.github.io/Formwheel/" aria-label="FormWheel 메인으로">FormWheel</a><div class="badge">RISK</div></div>

  <section id="home" class="card">
    <h1>Risk 🎲</h1>
    <p>점수를 걸고, 운과 배짱으로 승부하세요.</p>
    <input id="nameInput" maxlength="12" placeholder="닉네임을 입력하세요">
    <div class="row">
      <button class="primary" id="createBtn">방 만들기</button>
      <button class="secondary" id="joinBtn">참가</button>
    </div>
    <div id="joinArea" class="hidden">
      <input id="roomInput" maxlength="6" placeholder="방 코드 6자리">
      <button class="primary" id="joinConfirm">방 참가하기</button>
    </div>
  </section>

  <section id="lobby" class="card hidden">
    <h2>대기실</h2>
    <p>방 코드</p>
    <div id="roomCode" class="room"></div>
    <div id="players" class="players"></div>
    <div id="hostNotice" class="notice"></div>
    <button id="startBtn" class="primary">게임 시작</button>
  </section>

  <section id="game" class="card hidden">
    <div class="game-head">
      <div class="round" id="roundText">ROUND 1 / 7</div>
      <div class="score" id="myScore">내 점수 1,000</div>
    </div>
    <div id="resultBox" class="result hidden"></div>
    <div id="betArea">
      <h2>얼마를 걸까요?</h2>
      <p>많이 걸수록 보상도, 위험도 커집니다.</p>
      <div class="bet-grid" id="betGrid"></div>
      <button id="betBtn" class="primary" disabled>베팅하기</button>
      <div id="waitMsg" class="waitmsg hidden">다른 플레이어의 베팅을 기다리는 중...</div>
    </div>
    <div class="players-game" id="gamePlayers"></div>
    <div id="gameLog" class="log"></div>
  </section>

  <section id="end" class="card hidden center">
    <h1>🏆 GAME OVER</h1>
    <p id="winnerText"></p>
    <div id="finalScores" class="players-game"></div>
    <button class="primary" onclick="location.reload()">다시 하기</button>
  </section>
</div>

<script>
const MAX_PLAYERS=4, START_SCORE=1000, ROUNDS=7;
const CLIENT_ID = (crypto.randomUUID ? crypto.randomUUID() : ("c"+Math.random().toString(36).slice(2)+Date.now()));

// 결과 확률 (기존 대비 대박 -15%, 성공 -10%, 남는 확률은 실패:폭탄 = 2:1 비율로 재분배)
const ODDS = { success: 38.57, jackpot: 12.14, fail: 32.86, bomb: 16.43 };

let state={
  screen:"home", room:null, name:"",
  selected:null, pending:false,
  shownResultRound:0, localRound:1,
  pollTimer:null
};

const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString("ko-KR");
function show(id){["home","lobby","game","end"].forEach(x=>$(x).classList.toggle("hidden",x!==id));}
function randomCode(){return Math.floor(100000+Math.random()*900000).toString();}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function getName(){
  const n=$("nameInput").value.trim();
  if(!n){alert("닉네임을 입력해주세요.");return null}
  return n;
}
function roomKey(code){return `risk-room:${code}`;}

async function loadRoom(code){
  try{
    const r=await window.storage.get(roomKey(code), true);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function saveRoom(room){
  room.updatedAt=Date.now();
  try{
    await window.storage.set(roomKey(room.code), JSON.stringify(room), true);
    state.room=room;
    return true;
  }catch(e){
    alert("연결에 문제가 발생했습니다. 다시 시도해주세요.");
    return false;
  }
}
function me(room){ return room ? room.players.find(p=>p.id===CLIENT_ID) : null; }
function isHost(room){ return room && room.hostId===CLIENT_ID; }

// ---------- 홈 / 방 생성·참가 ----------
$("createBtn").onclick=async ()=>{
  const n=getName(); if(!n)return;
  state.name=n;
  const code=randomCode();
  const room={
    code, phase:"lobby", round:1, hostId:CLIENT_ID,
    players:[{id:CLIENT_ID,name:n,score:START_SCORE,bet:null}],
    log:[], lastResult:null
  };
  const ok=await saveRoom(room);
  if(!ok)return;
  startPolling();
  renderLobby();
  show("lobby");
};

$("joinBtn").onclick=()=>$("joinArea").classList.toggle("hidden");

$("joinConfirm").onclick=async ()=>{
  const n=getName(); if(!n)return;
  const code=$("roomInput").value.trim();
  if(!/^\d{6}$/.test(code)){alert("6자리 방 코드를 입력해주세요.");return}
  const room=await loadRoom(code);
  if(!room){alert("방을 찾을 수 없습니다. 코드를 확인해주세요.");return}
  if(room.phase!=="lobby"){alert("이미 시작된 게임입니다.");return}
  if(room.players.length>=MAX_PLAYERS){alert("방 인원이 가득 찼습니다.");return}
  if(room.players.some(p=>p.id===CLIENT_ID)){ /* 이미 참가한 경우 그대로 진행 */ }
  else{
    room.players.push({id:CLIENT_ID,name:n,score:START_SCORE,bet:null});
    const ok=await saveRoom(room);
    if(!ok)return;
  }
  state.name=n; state.room=room;
  startPolling();
  renderLobby();
  show("lobby");
};

$("startBtn").onclick=async ()=>{
  if(!state.room)return;
  const fresh=await loadRoom(state.room.code) || state.room;
  if(!isHost(fresh)){alert("호스트만 게임을 시작할 수 있습니다.");return}
  fresh.phase="playing"; fresh.round=1; fresh.log=[]; fresh.lastResult=null;
  fresh.players.forEach(p=>{p.score=START_SCORE;p.bet=null;});
  await saveRoom(fresh);
  state.localRound=1; state.shownResultRound=0; state.selected=null; state.pending=false;
  show("game");
  renderGame();
};

// ---------- 폴링 ----------
function startPolling(){
  if(state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer=setInterval(pollRoom,1500);
}
function stopPolling(){
  if(state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer=null;
}
async function pollRoom(){
  if(!state.room)return;
  const fresh=await loadRoom(state.room.code);
  if(!fresh)return;
  const prevPhase=state.room.phase;
  state.room=fresh;

  if(prevPhase==="lobby" && fresh.phase==="lobby"){
    renderLobby();
  }
  if(fresh.phase==="playing"){
    if(prevPhase==="lobby"){ // 다른 참가자 화면에서 호스트가 막 시작한 경우
      state.localRound=fresh.round; state.shownResultRound=0; state.selected=null; state.pending=false;
      show("game");
    }
    handlePlayingUpdate();
  }
  if(fresh.phase==="ended"){
    stopPolling();
    renderEnd();
  }

  // 호스트: 전원 베팅 완료 시 라운드 결과 계산
  if(isHost(fresh) && fresh.phase==="playing"){
    const allBet = fresh.players.length>0 && fresh.players.every(p=>p.bet!=null);
    const alreadyResolved = fresh.lastResult && fresh.lastResult.round===fresh.round;
    if(allBet && !alreadyResolved){
      await resolveRound(fresh);
    }
  }
}

// ---------- 대기실 ----------
function renderLobby(){
  const room=state.room; if(!room)return;
  $("roomCode").textContent=room.code;
  $("players").innerHTML=room.players.map(p=>`<div class="player ${p.id===CLIENT_ID?"me":""}">
    <b>${escapeHtml(p.name)}</b><span>${p.id===room.hostId?"👑 호스트":"플레이어"}</span></div>`).join("");
  const iAmHost=isHost(room);
  $("hostNotice").textContent=iAmHost
    ? `방 코드를 공유하고 참가자가 모이면 시작 버튼을 눌러주세요. (최대 ${MAX_PLAYERS}명)`
    : "호스트가 게임을 시작할 때까지 기다려주세요.";
  $("startBtn").classList.toggle("hidden",!iAmHost);
}

// ---------- 게임 화면 ----------
function pickOutcome(){
  const r=Math.random()*100;
  if(r<ODDS.success) return "success";
  if(r<ODDS.success+ODDS.jackpot) return "jackpot";
  if(r<ODDS.success+ODDS.jackpot+ODDS.fail) return "fail";
  return "bomb";
}

function renderGame(){
  const room=state.room; if(!room)return;
  const myself=me(room);
  if(!myself)return;
  $("roundText").textContent=`ROUND ${room.round} / ${ROUNDS}`;
  $("myScore").textContent=`내 점수 ${fmt(myself.score)}`;

  const max=Math.max(0,myself.score);
  const bets=[Math.min(100,max),Math.min(250,max),Math.min(500,max),max];
  const labels=["100","250","500","ALL-IN"];
  const myBetPlaced = myself.bet!=null;

  $("betGrid").innerHTML=labels.map((l,i)=>`<button class="bet ${state.selected===bets[i]&&bets[i]>0?"selected":""}" ${bets[i]<=0||myBetPlaced?"disabled":""} onclick="selectBet(${bets[i]})">${l}</button>`).join("");
  $("betBtn").disabled = !state.selected || myBetPlaced;
  $("betBtn").classList.toggle("hidden", myBetPlaced);
  $("waitMsg").classList.toggle("hidden", !myBetPlaced);

  $("gamePlayers").innerHTML=room.players.map(p=>{
    const tag = p.bet!=null ? `<span class="tag done">베팅완료</span>` : `<span class="tag wait">대기중</span>`;
    return `<div class="pbar"><span>${escapeHtml(p.name)}${p.id===CLIENT_ID?" (나)":""}</span><span style="display:flex;gap:8px;align-items:center"><b>${fmt(p.score)}</b>${tag}</span></div>`;
  }).join("");
}

function selectBet(v){
  const room=state.room; if(!room)return;
  const myself=me(room);
  if(!myself || myself.bet!=null)return;
  state.selected=v;
  renderGame();
}

$("betBtn").onclick=async ()=>{
  if(!state.selected)return;
  const fresh=await loadRoom(state.room.code) || state.room;
  const myself=me(fresh);
  if(!myself || myself.bet!=null)return;
  myself.bet=state.selected;
  const ok=await saveRoom(fresh);
  if(!ok)return;
  renderGame();
};

async function resolveRound(room){
  room.players.forEach(p=>{
    const outcome=pickOutcome();
    let delta=0,emoji="🟢",label="성공!";
    if(outcome==="success"){delta=p.bet;emoji="🟢";label="성공!";}
    if(outcome==="jackpot"){delta=p.bet*2;emoji="⚡";label="대박!";}
    if(outcome==="fail"){delta=-p.bet;emoji="🔴";label="실패...";}
    if(outcome==="bomb"){delta=-p.bet*2;emoji="💀";label="폭탄!";}
    delta=Math.max(-p.score,delta);
    p.score+=delta;
    p._lastDelta={id:p.id,name:p.name,delta,emoji,label};
  });
  const results=room.players.map(p=>p._lastDelta);
  room.players.forEach(p=>{delete p._lastDelta; p.bet=null;});
  room.lastResult={round:room.round, results};
  room.log=[{round:room.round, results}, ...room.log].slice(0,20);

  if(room.round>=ROUNDS){
    room.phase="ended";
  }else{
    room.round+=1;
  }
  await saveRoom(room);
  handlePlayingUpdate();
}

function handlePlayingUpdate(){
  const room=state.room; if(!room)return;

  if(room.lastResult && room.lastResult.round!==state.shownResultRound && room.lastResult.round===state.localRound){
    state.shownResultRound=room.lastResult.round;
    const mine = room.lastResult.results.find(r=>r.id===CLIENT_ID) || room.lastResult.results[0];
    $("resultBox").innerHTML=`<div class="emoji">${mine.emoji}</div><div class="big">${mine.label}</div><div>${mine.delta>=0?"+":""}${fmt(mine.delta)}점</div>`;
    $("resultBox").classList.remove("hidden");
    $("betArea").classList.add("hidden");
    $("gameLog").innerHTML=room.lastResult.results.map(r=>`${r.emoji} ${escapeHtml(r.name)}: ${r.delta>=0?"+":""}${fmt(r.delta)}점`).join("<br>")+"<br>"+$("gameLog").innerHTML;

    state.selected=null;
    state.localRound=room.round;

    setTimeout(()=>{
      $("resultBox").classList.add("hidden");
      $("betArea").classList.remove("hidden");
      renderGame();
    },1800);
  }else{
    renderGame();
  }
}

function renderEnd(){
  const room=state.room; if(!room)return;
  const sorted=[...room.players].sort((a,b)=>b.score-a.score);
  $("winnerText").textContent=`${escapeHtml(sorted[0].name)}님이 ${fmt(sorted[0].score)}점으로 우승했습니다!`;
  $("finalScores").innerHTML=sorted.map((p,i)=>`<div class="pbar"><span>${i+1}위 · ${escapeHtml(p.name)}${p.id===CLIENT_ID?" (나)":""}</span><b>${fmt(p.score)}점</b></div>`).join("");
  show("end");
}
</script>
</body>
</html>
