<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FormWheel Risk</title>
<link rel="stylesheet" href="./assets/styles.css">
<link rel="stylesheet" href="https://semicolonxss.github.io/Formwheel/shared/formwheel-ui.css">
<script defer src="https://semicolonxss.github.io/Formwheel/shared/formwheel-ui.js"></script>
<meta property="og:title" content="Risk · Formwheel">
<meta property="og:description" content="선택과 위험 요소를 이용해 경쟁하는 전략 게임.">
<meta property="og:image" content="https://semicolonxss.github.io/Formwheel_Risk/assets/thumbnail.svg">
<link rel="stylesheet" href="assets/formwheel-brand.css?v=20261008-hub-logo">
<link rel="icon" type="image/svg+xml" href="https://semicolonxss.github.io/Formwheel/assets/formwheel-favicon.svg">
</head>
<body>
<div class="app">
  <div class="top"><a class="logo fw-hub-logo" href="https://semicolonxss.github.io/Formwheel/" aria-label="FormWheel 메인으로 이동"><span class="fw-hub-form">Form</span><span class="fw-hub-icon" aria-hidden="true"></span><span class="fw-hub-wheel">Wheel</span></a><div class="badge">RISK</div></div>

  <section id="home" class="card">
    <h1>Risk 🎲</h1>
    <p>점수를 걸고, 운과 배짱으로 승부하세요.</p>
    <input id="nameInput" maxlength="12" placeholder="닉네임을 입력하세요">
    <div class="row">
      <button class="primary" id="createBtn">방 만들기</button>
      <button class="secondary" id="joinBtn">참가</button>
    </div>
    <div id="joinArea" class="hidden">
      <input id="roomInput" maxlength="6" placeholder="방 코드 6자리">
      <button class="primary" id="joinConfirm">방 참가하기</button>
    </div>
    <div id="connErr" class="connerr hidden"></div>
  </section>

  <section id="lobby" class="card hidden">
    <h2>대기실</h2>
    <p>방 코드</p>
    <div id="roomCode" class="room"></div>
    <div id="players" class="players"></div>
    <div id="hostNotice" class="notice"></div>
    <button id="startBtn" class="primary">게임 시작</button>
  </section>

  <section id="game" class="card hidden">
    <div class="game-head">
      <div class="round" id="roundText">ROUND 1 / 7</div>
      <div class="score" id="myScore">내 점수 1,000</div>
    </div>
    <div id="resultBox" class="result hidden"></div>
    <div id="betArea">
      <h2>얼마를 걸까요?</h2>
      <p>많이 걸수록 보상도, 위험도 커집니다.</p>
      <div class="bet-grid" id="betGrid"></div>
      <button id="betBtn" class="primary" disabled>베팅하기</button>
      <div id="waitMsg" class="waitmsg hidden">다른 플레이어의 베팅을 기다리는 중...</div>
    </div>
    <div class="players-game" id="gamePlayers"></div>
    <div id="gameLog" class="log"></div>
  </section>

  <section id="end" class="card hidden center">
    <h1>🏆 GAME OVER</h1>
    <p id="winnerText"></p>
    <div id="finalScores" class="players-game"></div>
    <button class="primary" onclick="location.reload()">다시 하기</button>
  </section>
</div>

<script type="module" src="./assets/app.js"></script>
</body>
</html>
